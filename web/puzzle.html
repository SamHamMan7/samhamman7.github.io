<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'">
<title>What would you do? · Pokémon Showdown</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style/battle.css">
<link rel="stylesheet" href="/style/oldclient.css">
<link rel="stylesheet" href="/style/sim-types.css">
<link rel="stylesheet" href="/style/utilichart.css">
<link rel="stylesheet" href="/style/font-awesome.css">
<style>
.puzzle-header{display:flex;align-items:center;gap:.8rem;padding:0 .65rem;height:49px;white-space:nowrap}
.puzzle-header strong{overflow:hidden;text-overflow:ellipsis}
.puzzle-header img{display:block}
#puzzle-room{position:absolute;inset:50px 0 0;overflow:auto}
#puzzle-room>.ps-room{inset:0}
#puzzle-room .battle-log{bottom:0}
#puzzle-room .battle-log-add,#puzzle-room .battle-userlist,#puzzle-room .timerbutton{display:none}
.puzzle-feedback{padding:4px 10px 12px;max-width:40em}
.puzzle-feedback p{margin:.55em 0}
.puzzle-feedback summary{cursor:pointer}
.puzzle-feedback .button{margin-top:.5em}
@media(max-width:520px){.puzzle-header img{width:101px;height:auto}.puzzle-header{gap:.45rem}}
</style>
</head>
<body>
<header class="header puzzle-header">
 <a href="./#play" aria-label="Games"><img src="/pokemonshowdownbeta.png" width="146" height="44" alt="Pokémon Showdown"></a>
 <strong>What would you do?</strong>
 <a class="button" href="./damage.html">Damage guess</a>
</header>
<div id="puzzle-room" class="ps-room" aria-label="Puzzle battle">
 <p role="status">Loading the battle…</p>
</div>
<script src="/config/config.js"></script>
<script src="/js/lib/jquery-2.2.4.min.js"></script>
<script src="/js/battle-sound.js"></script>
<script src="/js/lib/html-css-sanitizer-minified.js"></script>
<script src="/js/lib/lodash.core.js"></script>
<script src="/js/lib/backbone.js"></script>
<script src="/data/text/en.js"></script>
<script src="/js/battledata.js"></script>
<script src="/js/oldclient/storage.js"></script>
<script src="/data/pokedex-mini.js"></script>
<script src="/data/typechart.js"></script>
<script src="/data/pokedex.js"></script>
<script src="/data/moves.js"></script>
<script src="/data/items.js"></script>
<script src="/data/abilities.js"></script>
<script src="/js/battle.js"></script>
<script src="/data/commands.js"></script>
<script src="/js/oldclient/client.js"></script>
<script src="/js/oldclient/client-ladder.js"></script>
<script src="/js/oldclient/client-chat.js"></script>
<script src="/js/battle-tooltips.js"></script>
<script src="/js/oldclient/client-battle.js"></script>
<script src="/js/battle-animations.js"></script>
<script src="/js/battle-animations-moves.js"></script>
<script src="/data/offline-resource-fallbacks.js"></script>
<script src="/showdown-scene.js"></script>
<script type="module" src="./puzzle.js"></script>
</body>
</html>
