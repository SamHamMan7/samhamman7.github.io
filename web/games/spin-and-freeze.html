<title>Spin &amp; Freeze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one pixel-art screen, letterboxed, with a slim control strip under it. Single dark arcade look. */
:root {
  --bg: #0d1016;
  --frame: #1a1726;
  --fg: #e9e4d6;
  --muted: #8f8aa3;
  --accent: #ea4b4b;
  --ice: #8ee8ff;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--mono);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
}
.screen {
  width: min(100%, calc((100vh - 80px) * 16 / 9), 1440px);
  width: min(100%, calc((100dvh - 80px) * 16 / 9), 1440px);
  aspect-ratio: 16 / 9; max-width: 100%;
  border: 3px solid var(--frame); border-radius: 6px; box-shadow: 0 0 0 1px #2b2d42, 0 18px 50px rgba(0,0,0,0.6);
  background: #000; overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; touch-action: manipulation; }
.strip { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.strip kbd { font-family: var(--mono); color: var(--fg); border: 1px solid #3a3d58; border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; }
#mute { font: inherit; color: var(--fg); background: #2b2d42; border: 1px solid #545879; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
#mute:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
/* Phones: the keyboard hints go away and the screen takes all the room there is. */
@media (pointer: coarse) { .strip span { display: none; } #mute { min-height: 36px; padding: 6px 14px; } }
@media (max-height: 520px) and (orientation: landscape) {
  body { padding-block: 6px; gap: 0; }
  .screen { width: min(100%, calc((100dvh - 18px) * 16 / 9)); }
  .strip span { display: none; }
  #mute { position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: 8px; opacity: 0.75; }
}
/* Upright phone: turn the 16:9 screen a quarter turn so it fills the tall screen. */
body.turned { padding: 0; }
body.turned .screen { position: fixed; left: 50%; top: 50%; width: min(calc(100dvh - 16px), calc((100dvw - 16px) * 16 / 9)); max-width: none; transform: translate(-50%, -50%) rotate(90deg); }
body.turned .strip span { display: none; }
body.turned #mute { position: fixed; right: 8px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); opacity: 0.7; font-size: 11px; }
</style>
<div class="screen"><canvas id="game" width="1280" height="720" aria-label="Spin and Freeze game screen"></canvas></div>
<div class="strip">
  <span>Click a symbol to freeze it</span>
  <span><kbd>Space</kbd> spin</span>
  <span><kbd>Esc</kbd> close</span>
  <button id="mute" type="button" aria-pressed="true">Sound on</button>
</div>

D.SYMBOL_ORDER = Object.keys(D.SYMBOLS);
D.SHOP_SYMBOLS = D.SYMBOL_ORDER.filter(id => !D.SYMBOLS[id].token);
D.CHARM_ORDER = Object.keys(D.CHARMS);
D.TICKET_ORDER = Object.keys(D.TICKETS);
D.GLITCH_ORDER = Object.keys(D.GLITCHES);
D.ITEM = { ticket: D.TICKETS, glitch: D.GLITCHES };
D.HAND_INDEX = {}; D.HANDS.forEach((h, i) => { D.HAND_INDEX[h.id] = i; D.HANDS[h.id] = h; });

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = p => p[0] * 100 + p[1];

const L = {
  newRun() {
    const run = { ante: 1, blindIdx: 0, blindNo: 0, money: 4, rows: 3, cols: 3, bag: [], charms: [], items: [], parts: {}, levels: {}, coupons: [],
      baseSpins: 4, baseFrost: 3, shatterAt: 3, bosses: [], uid: 0, stats: { best: 0, spins: 0, added: 0 } };
    D.STARTING_BAG.forEach(id => L.addItem(run, id));
    D.HANDS.forEach(h => run.levels[h.id] = 1);
    const order = shuffle(D.BOSS_ORDER.slice());
    for (let a = 0; a < D.WIN_ANTE; a++) run.bosses[a] = order[a % order.length];
    return run;
  },
  addItem(run, id, enh) { run.uid++; const it = { id, uid: run.uid, bonus: 0, counter: 0, cracked: -1, enh: enh || null }; run.bag.push(it); return it; },
  destroyItem(run, it) { const i = run.bag.indexOf(it); if (i >= 0 && run.bag.length > 5) { run.bag.splice(i, 1); return true; } return false; },
  has(run, id) { return run.charms.includes(id); },
  count(run, id) { return run.bag.filter(x => x.id === id).length; },
  spinsFor(run) { return run.baseSpins + (run.parts.second_lever ? 1 : 0); },
  frostFor(run) { return run.baseFrost + (run.parts.cold_coil ? 1 : 0) + (L.has(run, 'coldstore') ? 1 : 0); },
  growAt(run) { return L.has(run, 'greenhouse') ? 1 : 2; },
  blindInfo(run, idx = run.blindIdx) {
    const b = D.BLINDS[idx];
    const base = D.ANTE_BASE[Math.min(run.ante, D.ANTE_BASE.length) - 1];
    return { name: b.name, target: Math.round(base * b.mult / 10) * 10, reward: b.reward, boss: idx === 2 ? run.bosses[run.ante - 1] : null };
  },
  mkCell(it) { const c = { item: it, frozen: false, stacks: 0 }; if (it.id === 'pip') c.roll = 1 + rnd(6); return c; },
  sym(cell) { return cell && cell.item ? cell.item.id : null; },
  startBlind(run) {
    run.blindNo++;
    const info = L.blindInfo(run);
    const b = { info, boss: info.boss, target: info.target, score: 0, spinsLeft: L.spinsFor(run), frostLeft: L.frostFor(run), grid: [], rustCol: null, spun: false };
    for (let r = 0; r < run.rows; r++) b.grid.push(new Array(run.cols).fill(null));
    run.blind = b;
    const pool = shuffle(run.bag.slice());
    if (b.boss === 'rust') {
      b.rustCol = rnd(run.cols);
      for (let r = 0; r < run.rows; r++) { const it = pool.pop(); if (it) { const c = L.mkCell(it); c.rusted = true; b.grid[r][b.rustCol] = c; } }
    }
    if (b.boss !== 'thaw') {
      const anchors = run.bag.filter(it => it.id === 'anchor' && !L.onGrid(run, it));
      const empties = [];
      for (let r = 0; r < run.rows; r++) for (let c = 0; c < run.cols; c++) if (!b.grid[r][c]) empties.push([r, c]);
      shuffle(empties);
      anchors.slice(0, empties.length).forEach((it, i) => { const [r, c] = empties[i]; const cell = L.mkCell(it); cell.frozen = true; b.grid[r][c] = cell; });
    }
  },
  onGrid(run, it) { const b = run.blind; if (!b) return false; for (const row of b.grid) for (const c of row) if (c && c.item === it) return true; return false; },
  canToggle(run, r, c) {
    const b = run.blind, cell = b.grid[r][c];
    if (!cell || !cell.item || cell.rusted) return [false, 'Nothing to freeze'];
    if (b.boss === 'thaw') return [false, 'The Thaw: no freezing'];
    if (cell.frozen) return [true];
    if (b.frostLeft <= 0) return [false, 'No Frost left'];
    return [true];
  },
  toggle(run, r, c) {
    const [ok, why] = L.canToggle(run, r, c);
    if (!ok) return [false, why];
    const cell = run.blind.grid[r][c];
    if (cell.frozen) { cell.frozen = false; cell.stacks = 0; } else { cell.frozen = true; run.blind.frostLeft--; }
    return [true];
  },
  neighbors(run, r, c) {
    return [[-1, 0], [1, 0], [0, -1], [0, 1]].map(([dr, dc]) => [r + dr, c + dc]).filter(([a, d]) => a >= 0 && a < run.rows && d >= 0 && d < run.cols);
  },
  // One spin: frost ticks, the bag is dealt into free cells, then symbols interact.
  spin(run) {
    const b = run.blind;
    const rep = { landed: [], shattered: [], grew: [], snow: [], events: [], gremlin: 0, tilted: false, empties: 0 };
    b.spinsLeft--; b.spun = true; run.stats.spins++;
    const growAt = L.growAt(run);
    for (let r = 0; r < run.rows; r++) for (let c = 0; c < run.cols; c++) {
      const cell = b.grid[r][c];
      if (!(cell && cell.frozen && cell.item)) continue;
      cell.stacks++;
      const id = cell.item.id;
      if ((id === 'seed' || id === 'egg') && cell.stacks >= growAt) {
        cell.item.id = id === 'seed' ? 'flower' : 'chick'; cell.frozen = false; cell.stacks = 0;
        rep.grew.push({ r, c, to: cell.item.id });
        continue;
      }
      if (id !== 'anchor' && id !== 'hourglass' && cell.item.enh !== 'frostproof' && cell.stacks >= run.shatterAt) {
        rep.shattered.push({ r, c, sym: id });
        cell.item.cracked = run.blindNo;
        if (id === 'phoenix') { L.addItem(run, 'phoenix'); rep.events.push({ r, c, text: 'Reborn!', col: 'orange' }); }
        b.grid[r][c] = null;
      }
    }
    // deal the bag
    const held = new Set();
    for (const row of b.grid) for (const cell of row) if (cell && (cell.frozen || cell.rusted)) held.add(cell.item);
    const avail = shuffle(run.bag.filter(it => !held.has(it) && it.cracked !== run.blindNo));
    const shat = new Set(rep.shattered.map(s => s.r * 100 + s.c));
    for (let r = 0; r < run.rows; r++) for (let c = 0; c < run.cols; c++) {
      const cell = b.grid[r][c];
      if (cell && (cell.frozen || cell.rusted)) continue;
      if (shat.has(r * 100 + c)) continue;
      const it = avail.pop();
      b.grid[r][c] = it ? L.mkCell(it) : null;
      if (it) rep.landed.push({ r, c }); else rep.empties++;
    }
    // landing effects
    for (const p of rep.landed) {
      const cell = b.grid[p.r][p.c];
      if (cell.item.id === 'snowman' && b.boss !== 'thaw') {
        const opts = L.neighbors(run, p.r, p.c).filter(([a, d]) => { const n = b.grid[a][d]; return n && n.item && !n.frozen && !n.rusted; });
        if (opts.length) { const [a, d] = pick(opts); b.grid[a][d].frozen = true; rep.snow.push({ r: a, c: d }); }
      } else if (cell.item.id === 'gremlin') rep.gremlin++;
    }
    run.money -= rep.gremlin;
    // interactions between neighbors
    const each = fn => { for (let r = 0; r < run.rows; r++) for (let c = 0; c < run.cols; c++) { const cell = b.grid[r][c]; if (cell && cell.item) fn(cell, r, c); } };
    const nb = (r, c, id) => L.neighbors(run, r, c).filter(([a, d]) => L.sym(b.grid[a][d]) === id);
    each((cell, r, c) => { if (cell.item.id === 'magpie') { cell.item.counter++; if (cell.item.counter % 3 === 0) { run.money += 3; rep.events.push({ r, c, text: '+$3', col: 'gold', money: 3 }); } } });
    each((cell, r, c) => { if (cell.item.id === 'rain') for (const [a, d] of nb(r, c, 'seed')) { b.grid[a][d].item.id = 'flower'; rep.events.push({ r: a, c: d, text: 'Bloom!', col: 'green' }); } });
    each((cell, r, c) => {
      if (cell.item.id !== 'cat') return;
      for (const [a, d] of nb(r, c, 'milk')) { const m = b.grid[a][d]; if (L.destroyItem(run, m.item)) { b.grid[a][d] = null; cell.item.bonus += 2; rep.events.push({ r, c, text: 'Slurp! +2', col: 'blue' }); } }
    });
    each((cell, r, c) => {
      if (cell.item.id === 'key' && nb(r, c, 'chest').length) { if (L.destroyItem(run, cell.item)) { b.grid[r][c] = null; run.money += 4; rep.events.push({ r, c, text: 'Opened! +$4', col: 'gold', money: 4 }); } }
    });
    each((cell, r, c) => { if (cell.item.id === 'miner') for (const [a, d] of nb(r, c, 'ore')) { b.grid[a][d].item.id = 'gem'; rep.events.push({ r: a, c: d, text: 'Gem!', col: 'ice' }); } });
    if (b.boss === 'tilt') { for (const row of b.grid) row.push(row.shift()); rep.tilted = true; }
    return rep;
  },
  findHands(run) {
    const b = run.blind, R = run.rows, C = run.cols, mime = b.boss === 'mime';
    const symAt = p => L.sym(b.grid[p[0]][p[1]]);
    const endWild = s => s === 'bread' || s === 'crown' || (s === 'wild' && !mime);
    const anyWild = s => s === 'wild' && !mime;
    const mirror = s => s === 'mirror' && !mime;
    const endsMatch = (a, z) => {
      if (!a || !z) return false;
      if (endWild(a) || endWild(z)) return true;
      return (mirror(a) ? z : a) === (mirror(z) ? a : z);
    };
    const allMatch = (syms, ends) => {
      let base = null;
      const flex = (s, i) => anyWild(s) || (ends[i] && (endWild(s) || mirror(s)));
      for (let i = 0; i < syms.length; i++) { if (!syms[i]) return false; if (!flex(syms[i], i) && !base) base = syms[i]; }
      if (!base) return true;
      for (let i = 0; i < syms.length; i++) if (!flex(syms[i], i) && syms[i] !== base) return false;
      return true;
    };
    const all = [], allpos = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { all.push(symAt([r, c])); allpos.push([r, c]); }
    if (allMatch(all, [])) return [{ kind: 'jackpot', cells: allpos, ends: [] }];
    const lines = [];
    for (let r = 0; r < R; r++) { const l = { kind: 'row', cells: [] }; for (let c = 0; c < C; c++) l.cells.push([r, c]); lines.push(l); }
    for (let c = 0; c < C; c++) { const l = { kind: 'col', cells: [] }; for (let r = 0; r < R; r++) l.cells.push([r, c]); lines.push(l); }
    let hands = []; const hits = [];
    for (const l of lines) {
      const n = l.cells.length, syms = l.cells.map(symAt), a = syms[0], z = syms[n - 1];
      const ends = []; ends[0] = true; ends[n - 1] = true;
      let h = null;
      if (n >= 3 && allMatch(syms, ends)) h = { kind: 'fullline', cells: l.cells, ends: [l.cells[0], l.cells[n - 1]], line: l };
      else if (endsMatch(a, z)) h = { kind: 'bookend', cells: l.cells, ends: [l.cells[0], l.cells[n - 1]], line: l };
      else for (let i = 0; i < n - 1; i++) if (syms[i] && syms[i] === syms[i + 1]) { h = { kind: 'pair', cells: [l.cells[i], l.cells[i + 1]], ends: [], line: l }; break; }
      if (h) {
        if (h.kind !== 'pair' && (a === 'crown' || z === 'crown')) { h.kind = D.HANDS[Math.min(D.HAND_INDEX[h.kind] + 1, D.HANDS.length - 1)].id; h.crowned = true; }
        hands.push(h); if (h.ends.length) hits.push(h);
      }

const AU = {
  ctx: null, muted: false,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  tone(f0, f1, dur, type = 'square', vol = 0.12, delay = 0) {

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  noise(dur, vol = 0.2, hp = 1000) {

      case 'land': this.tone(240 * p, 110 * p, 0.09, 'triangle', 0.25); break;
      case 'click': this.tone(600 * p, 600 * p, 0.05, 'square', 0.05); break;
      case 'chip': this.tone(880 * p, 880 * p, 0.08, 'triangle', 0.2); break;
      case 'mult': this.tone(520 * p, 780 * p, 0.12, 'square', 0.07); break;
      case 'xmult': this.tone(300, 900, 0.22, 'square', 0.08); this.tone(150, 150, 0.22, 'triangle', 0.15); break;
      case 'money': this.tone(1320, 1320, 0.06, 'square', 0.05); this.tone(1760, 1760, 0.1, 'square', 0.05, 0.06); break;
      case 'freeze': this.tone(2400, 1800, 0.25, 'triangle', 0.08); this.noise(0.2, 0.08, 3000); break;
      case 'shatter': this.noise(0.35, 0.3, 1500); this.tone(3200, 2000, 0.3, 'triangle', 0.05); break;
      case 'score': this.tone(440 * p, 880 * p, 0.3, 'triangle', 0.22); break;
      case 'hand': this.tone(660 * p, 660 * p, 0.18, 'triangle', 0.18); this.tone(990 * p, 990 * p, 0.18, 'triangle', 0.08); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.2, 'triangle', 0.2, i * 0.14)); break;
      case 'lose': this.tone(300, 100, 0.8, 'triangle', 0.25); break;
    }
  },

// Rich text: {b:..} chips, {r:..} mult, {y:..} money, {i:..} frost, {p:..} names, {g:..} good
const RICH = { b: '#3b8ee8', r: '#ea4b4b', y: '#d9a400', i: '#2aa6cf', p: '#9b4fd6', g: '#2e9e52' };

      text(a <= run.ante ? D.BOSSES[run.bosses[a - 1]].name : '???', f.x + 300, y, C.white);
    }
  } else {
    const lines = ['Grid: ' + run.rows + ' x ' + run.cols + ' (' + run.rows * run.cols + ' cells)', 'Bag: ' + run.bag.length + ' symbols', 'Spins per machine: ' + L.spinsFor(run), 'Frost per machine: ' + L.frostFor(run), 'Shatters at: ' + run.shatterAt + ' frost'];
    lines.forEach((l, i) => text(l, f.x + 30, f.y + 60 + i * 14));
    const owned = D.PART_ORDER.filter(id => run.parts[id]);
    text('Machine parts', f.x + 260, f.y + 60, C.gold);
    if (!owned.length) text('None yet', f.x + 260, f.y + 74, C.dim);
    else tileGrid(owned, 'part', f.x + 260, f.y + 74, 3, 52, { count: id => run.parts[id] > 1 ? 'x' + run.parts[id] : '' });
  }
}
function drawOptions() {
  const f = overlayFrame('Options', null, 340, 250);
  text('Game speed', f.x, f.y + 40, C.white, 1, 'center', f.w);
  SPEEDS.forEach((s, i) => button('spd' + i, s.name, f.x + 22 + i * 75, f.y + 52, 70, 24, i === G.speed ? C.blue : C.panel2, true, () => setSpeed(i)));
  button('snd', AU.muted ? 'Sound: Off' : 'Sound: On', f.x + 22, f.y + 90, 145, 24, C.panel2, true, toggleMute);
  button('rtut', 'Replay tutorial', f.x + 173, f.y + 90, 145, 24, C.purple, true, () => { G.tutSeen = {}; store.set('sf_tut2', {}); G.overlay = null; if (G.state === 'play') maybeTut('A'); });
  if (G.run) {
    button('quit', G.confirmQuit ? 'Click again to abandon run' : 'Main menu', f.x + 22, f.y + 128, f.w - 44, 24, G.confirmQuit ? C.red : C.panel2, true, () => { if (G.confirmQuit) toMenu(); else G.confirmQuit = true; });
    if (!G.confirmQuit) text('Your run will be lost', f.x, f.y + 158, C.dim, 1, 'center', f.w);
  }
}
function drawBagOverlay() {
  const run = G.run, scrap = G.state === 'shop', f = overlayFrame('Your bag (' + run.bag.length + ')', null, 520, 310);
  const cells = run.rows * run.cols;
  drawRich(richLines('Every spin the whole bag is shuffled and dealt into free cells. Your grid has {b:' + cells + '} cells' + (run.bag.length < cells ? ', so {r:' + (cells - run.bag.length) + ' will stay empty}.' : '.'), f.w - 40, C.white), f.x + 20, f.y + 34, f.w - 40, 'center');
  if (scrap) text('Click a symbol to scrap one copy for $' + L.SCRAP, f.x, f.y + 58, C.gold, 1, 'center', f.w);
  const ids = D.SYMBOL_ORDER.filter(id => L.count(run, id) > 0);
  tileGrid(ids, 'symbol', f.x + 30, f.y + 72, 9, 46, {
    count: id => 'x' + L.count(run, id),
    note: id => { const its = run.bag.filter(x => x.id === id), b = its.reduce((a, x) => a + x.bonus, 0), en = its.filter(x => x.enh).map(x => D.ENH[x.enh].name);
      return (b ? 'Your copies have {b:+' + b + '} bonus value.' : '') + (en.length ? ' Upgraded: {y:' + en.join(', ') + '}.' : ''); },
    extra: scrap ? () => 'Click to scrap ($' + L.SCRAP + ')' : null,
    click: scrap ? (id, x, y, j) => { const [ok, why] = L.scrap(run, id); if (ok) { AU.play('shatter'); FX.burst(x + 23, y + 20, 10, C.grey, 60, 0.4); FX.juice(j, 0.3); } else FX.popup(x + 23, y, why, C.grey); } : null,
  });
}

// ------------------------------------------------------------ tutorial callout
function drawDiagram(kind, x, y, w) {
  const cell = (cx, cy, sym, border, frozen, stacks) => {
    panel(cx, cy, 30, 30, sym ? C.panel2 : '#202033'); if (sym) sprite(IMG.sym[sym], cx + 15, cy + 15, 1.5);
    if (frozen) { rect(cx + 2, cy + 2, 26, 26, 'rgba(142,232,255,0.25)'); ctx.strokeStyle = C.ice; ctx.lineWidth = 1; ctx.strokeRect(cx + 1.5, cy + 1.5, 27, 27); for (let k = 0; k < stacks; k++) sprite(IMG.icon.frost, cx + 24 - k * 8, cy + 6, 1); }
    if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.strokeRect(cx, cy, 30, 30); }
  };
  if (kind === 'bookend') {
    const x0 = x + (w - 4 * 34) / 2;
    ['cherry', 'bell', 'coin', 'cherry'].forEach((s, i) => cell(x0 + i * 34, y, s, i === 0 || i === 3 ? C.gold : C.white));
    text('Gold ends match, white middle scores', x, y + 34, C.grey, 1, 'center', w);
  } else if (kind === 'freeze') {
    const x0 = x + (w - 4 * 38) / 2;
    cell(x0, y, 'bell', null, true, 1); cell(x0 + 38, y, 'bell', null, true, 2); cell(x0 + 76, y, 'bell', C.red, true, 2); cell(x0 + 114, y, 'flower');
    text('+2', x0 + 8, y + 34, C.ice); text('+4', x0 + 46, y + 34, C.ice); text('cracks', x0 + 74, y + 34, C.red); text('seed', x0 + 116, y + 34, C.green);
  } else if (kind === 'bag') {
    const x0 = x + (w - 5 * 34) / 2;
    ['cherry', 'bell', 'seed', 'coin', null].forEach((s, i) => cell(x0 + i * 34, y, s));
    text('each symbol lands once per spin', x, y + 34, C.grey, 1, 'center', w);
  }
}
function drawTutorial() {
  const T = G.tut; if (!T) return;
  const st = T.steps[T.idx], hl = st.hl ? st.hl() : null;
  ctx.fillStyle = 'rgba(8,8,14,0.66)';
  if (hl) {
    const p = 4, a = { x: hl.x - p, y: hl.y - p, w: hl.w + 2 * p, h: hl.h + 2 * p };
    ctx.fillRect(0, 0, W, a.y); ctx.fillRect(0, a.y + a.h, W, H - a.y - a.h); ctx.fillRect(0, a.y, a.x, a.h); ctx.fillRect(a.x + a.w, a.y, W - a.x - a.w, a.h);
    ctx.strokeStyle = `rgba(255,201,60,${0.6 + 0.4 * Math.sin(performance.now() / 200)})`; ctx.lineWidth = 2; ctx.strokeRect(a.x, a.y, a.w, a.h);
  } else ctx.fillRect(0, 0, W, H);
  const bw = 240, lines = richLines(st.body, bw - 20, C.white), dh = st.diagram ? 50 : 0, bh = 34 + lines.length * 10 + dh + 34;
  let bx, by;
  if (!hl) { bx = (W - bw) / 2; by = (H - bh) / 2; }
  else {
    if (hl.x + hl.w + bw + 16 < W) bx = hl.x + hl.w + 12; else if (hl.x - bw - 12 > 0) bx = hl.x - bw - 12; else bx = (W - bw) / 2;
    by = Math.max(8, Math.min(H - bh - 8, hl.y + hl.h / 2 - bh / 2));
    if (bx === (W - bw) / 2) by = hl.y > H / 2 ? Math.max(8, hl.y - bh - 12) : Math.min(H - bh - 8, hl.y + hl.h + 12);
  }
  panel(bx, by, bw, bh, C.ink); panel(bx + 2, by + 2, bw - 4, bh - 4, C.panel);
  rect(bx + 4, by + 4, bw - 8, 2, C.gold);
  text(st.title, bx + 10, by + 12, C.gold, 2);
  text((T.idx + 1) + '/' + T.steps.length, bx, by + 14, C.dim, 1, 'right', bw - 10);
  drawRich(lines, bx + 10, by + 34, bw - 20);
  if (st.diagram) drawDiagram(st.diagram, bx, by + 38 + lines.length * 10, bw);
  const last = T.idx === T.steps.length - 1;
  button('tnext', last ? 'Got it' : 'Next', bx + bw - 84, by + bh - 28, 74, 20, C.orange, true, () => { if (last) endTut(false); else T.idx++; });
  button('tskip', 'Skip tutorial', bx + 10, by + bh - 28, 100, 20, C.dim, true, () => endTut(true));
}
function drawBanner() {
  const b = G.banner; if (!b) return;
  const a = Math.max(0, Math.min(1, b.t * 6, (b.dur - b.t) * 4));
  rect(0, 160, W, 40, `rgba(0,0,0,${0.55 * a})`);
  withJuice(b, W / 2, 180, () => text(b.text, 0, 170, b.col, 3, 'center', W, a));
}
function drawFxLayer() {
  for (const p of FX.parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); rect(p.x, p.y, p.sz, p.sz, p.col); }
  ctx.globalAlpha = 1;
  for (const p of FX.popups) {
    const k = p.t / p.life, a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3, y = p.y - 16 * (1 - (1 - Math.min(1, k * 2)) ** 3), w = textW(p.text), sc = 1 + 0.3 * Math.max(0, 1 - k * 6);
    ctx.save(); ctx.translate(Math.floor(p.x), Math.floor(y)); ctx.scale(sc, sc); ctx.globalAlpha = a;
    if (p.bg) panel(-w / 2 - 4, -7, w + 8, 14, p.bg);
    text(p.text, -w / 2, -3, p.col); ctx.restore();
  }
}

// ------------------------------------------------------------ loop
function update(rawDt) {
  const dt = rawDt * SPEEDS[G.speed].k;
  FX.update(G.tut ? rawDt : dt);
  if (G.bgT) for (let i = 0; i < 2; i++) for (let k = 0; k < 3; k++) G.bg[i][k] += (G.bgT[i][k] - G.bg[i][k]) * Math.min(1, rawDt * 3);
  if (G.state === 'play' && G.run) {
    let any = false;
    G.cv.forEach((row, r) => row.forEach((v, c) => {
      if (v.reel) { any = true; if (FX.time >= v.reelUntil) { v.reel = false; FX.juice(v, 0.35, 0); AU.play('land', 0.9 + c * 0.06); } }
    }));
    if (any) { G.tickT -= dt; if (G.tickT <= 0) { G.tickT = 0.07; AU.play('tick', 0.9 + Math.random() * 0.3); } }
  }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
}
function draw() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.imageSmoothingEnabled = false;
  UI.hot = []; UI.tip = null;
  drawBackground();
  if (G.state === 'menu') drawMenu();
  else {
    drawLeft();
    drawCharms(G.state === 'shop' && !G.overlay);
    if (G.state === 'play') drawPlay();
    else if (G.state === 'select') drawSelect();
    else if (G.state === 'shop') drawShop();
    else if (G.state === 'cashout') drawCashout();
    else if (G.state === 'pack') drawPack();
    else if (G.state === 'gameover') drawEnd(false);
    else if (G.state === 'victory') drawEnd(true);
  }
  if (G.overlay) {
    UI.hot = []; UI.tip = null;
    ({ collection: drawCollection, howto: drawHowTo, runinfo: drawRunInfo, options: drawOptions, bag: drawBagOverlay })[G.overlay]();
  }
  drawFxLayer(); drawBanner();
  if (G.tut && !G.overlay) { UI.hot = []; UI.tip = null; drawTutorial(); }
  drawTooltip();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(CRT, 0, 0);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------ input
function toCanvas(e) { const r = canvas.getBoundingClientRect();
  // Held upright on a phone the screen is drawn turned a quarter turn, so taps are turned back.
  if (document.body.classList.contains('turned')) return [(e.clientY - r.top) * W / r.height, (r.right - e.clientX) * H / r.width];
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
canvas.addEventListener('pointermove', e => { [UI.mx, UI.my] = toCanvas(e); });
canvas.addEventListener('pointerleave', () => { UI.mx = UI.my = -1; UI.down = false; });
canvas.addEventListener('pointerdown', e => {
  AU.init(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  [UI.mx, UI.my] = toCanvas(e); UI.down = true;
  for (let i = UI.hot.length - 1; i >= 0; i--) { const h = UI.hot[i]; if (UI.mx >= h.x && UI.mx < h.x + h.w && UI.my >= h.y && UI.my < h.y + h.h) { h.fn(); break; } }
});
window.addEventListener('pointerup', () => { UI.down = false; });
const muteBtn = document.getElementById('mute');
function toggleMute() { AU.init(); AU.muted = !AU.muted; if (muteBtn) { muteBtn.textContent = AU.muted ? 'Sound off' : 'Sound on'; muteBtn.setAttribute('aria-pressed', String(!AU.muted)); } }
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && G.state === 'play') { e.preventDefault(); AU.init(); doSpin(); }
  else if (e.key === 'Escape') { G.overlay = null; G.target = null; G.selItem = null; }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});
if (muteBtn) muteBtn.addEventListener('click', toggleMute);
{ const upright = matchMedia('(orientation: portrait) and (max-width: 700px)'), turn = () => document.body.classList.toggle('turned', upright.matches); upright.addEventListener('change', turn); turn(); }
requestAnimationFrame(frame);
</script>
