name: Publish static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the reviewed bot source and matching offline download
        run: python3 apply-bot-update.py
      - name: Verify all offline pack bytes and static sprite aliases
        run: node verify-offline.mjs
      - name: Check math practice
        run: node verify-practice.mjs
      - name: Check damage guesses and puzzle controls
        run: node --test tests/mini-games.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      # The artifact can take a few seconds to appear in the deployment service
      # even after the upload has finalized. Use a new name on a workflow retry.
      - name: Wait for Pages artifact metadata
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
